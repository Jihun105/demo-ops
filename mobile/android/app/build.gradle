apply plugin: 'com.android.application'

android {
    namespace = "kr.demo.field"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "kr.demo.field"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "1.7.3"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('DEMO_ANDROID_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('DEMO_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('DEMO_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('DEMO_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.work:work-runtime:2.12.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.17"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 서명 설정 누락 시 unsigned/debug APK로 대체하지 않고 release 빌드를 중단합니다.
tasks.register('requireDemoReleaseSigning') {
    doLast {
        for (name in ['DEMO_ANDROID_KEYSTORE', 'DEMO_ANDROID_STORE_PASSWORD', 'DEMO_ANDROID_KEY_ALIAS', 'DEMO_ANDROID_KEY_PASSWORD']) {
            if (!System.getenv(name)?.trim()) throw new GradleException('정식 서명 설정이 필요합니다. npm run android:release를 사용해주세요.')
        }
        if (!file(System.getenv('DEMO_ANDROID_KEYSTORE')).isFile() || System.getenv('DEMO_ANDROID_KEY_ALIAS').equalsIgnoreCase('androiddebugkey')) {
            throw new GradleException('정식 서명 키 파일과 별칭을 확인해주세요.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn('requireDemoReleaseSigning') }
